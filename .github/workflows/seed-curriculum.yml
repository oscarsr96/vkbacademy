# Siembra el catálogo de asignaturas y temarios de ESO/Bachillerato (Comunidad de
# Madrid) contra la BD de un entorno (PRE o PROD), usando el script idempotente
# prisma/seed-curriculum.ts. No borra ni modifica módulos existentes (upsert por
# título normalizado); los cursos ya existentes no se tocan salvo para rellenar
# subject/schoolYearId si están a null.
#
# Uso: Actions → "Seed currículo" → Run workflow → elegir entorno y filtros opcionales.
# Por defecto dryRun=true: no escribe nada en la BD hasta que se ponga a false a propósito.
# El entorno "prod" usa el environment `prod-canary`, protegido por el mismo gate
# de aprobación que las migraciones de PROD.

name: Seed currículo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno cuya BD se siembra'
        required: true
        type: choice
        options:
          - pre
          - prod
      level:
        description: 'Nivel opcional (1eso, 2eso, 3eso, 4eso, 1bach, 2bach). Vacío = todos.'
        required: false
        type: string
      subject:
        description: 'Filtro opcional de asignatura (texto libre, comparación normalizada). Vacío = todas.'
        required: false
        type: string
      dryRun:
        description: 'Dry-run: si es true, no escribe nada en la BD (solo imprime lo que haría)'
        required: false
        type: boolean
        default: true

jobs:
  seed:
    name: Seed currículo (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment == 'prod' && 'prod-canary' || 'pre' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm --filter @vkbacademy/api exec prisma generate

      - name: Validar catálogo de currículo
        working-directory: apps/api
        run: npx ts-node prisma/validate-curriculum.ts

      - name: Ejecutar seed de currículo
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEVEL: ${{ inputs.level }}
          SUBJECT: ${{ inputs.subject }}
          DRY_RUN: ${{ inputs.dryRun }}
        run: |
          ARGS=()
          if [ -n "$LEVEL" ]; then ARGS+=("--level=$LEVEL"); fi
          if [ -n "$SUBJECT" ]; then ARGS+=("--subject=$SUBJECT"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=("--dry-run"); fi
          npx ts-node prisma/seed-curriculum.ts "${ARGS[@]}"
